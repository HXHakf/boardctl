name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: selftest（不需要开发板）
        run: python boardctl.py selftest
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI 能起来
        run: python boardctl.py --help
